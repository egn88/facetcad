server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The UI is a single page; unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it is the only file whose name does not
    # change between builds, so a cached copy keeps pointing at a bundle that
    # no longer exists and the browser silently runs the previous release.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Hashed assets, by contrast, can be cached indefinitely — a new build
    # produces a new name.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The browser only ever talks to the public API, so a plain reverse proxy
    # is all that is required.
    # The MCP endpoint lives beside the API rather than under it, so the URL a
    # client is given is the short one people expect: https://host/mcp.
    # Both spellings reach the same place. The transport is mounted at /mcp/
    # inside the app, and a client handed "https://host/mcp" should not have to
    # discover that a redirect is waiting for it.
    # The prefix rules below do not match this, and it must not fall through to
    # the single-page app.
    location = /mcp.json {
        proxy_pass http://api:8000/mcp.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://api:8000/mcp/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /mcp/ {
        proxy_pass http://api:8000/mcp/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        # A tool call can take as long as a rebuild, and the streamable
        # transport holds the response open while it does.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # a large rebuild can take a while
    }

    gzip on;
    gzip_types text/css application/javascript application/json model/stl;
    gzip_min_length 1024;
}
