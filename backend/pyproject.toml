[project]
name = "facet"
version = "0.1.0"
description = "Parameter-sheet driven parametric CAD with deterministic topological naming"
license = "MIT"
authors = [{ name = "eloy" }]
keywords = ["cad", "parametric", "opencascade", "mcp", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
occt = ["cadquery-ocp>=7.7,<7.9"]
# The MCP server talks to the API over HTTP, so the API itself never needs the
# protocol library — only whoever runs the agent-facing wrapper does.
mcp = ["mcp>=2.0,<3", "httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["occt: requires the OpenCascade kernel to be installed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The agent guide is Markdown carried in a string literal. Its tables and JSON
# examples have to stay on one line to render, and wrapping them to satisfy a
# Python line limit would break the document it is.
"src/facet/adapters/http/guide.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
